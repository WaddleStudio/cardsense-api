# --- Repository ---
# local (default): SQLite for local development
# prod profile (application-prod.properties): Supabase PostgreSQL
cardsense.repository.mode=sqlite
cardsense.repository.sqlite.path=${CARDSENSE_DB_PATH:/app/data/cardsense.db}
cardsense.engine.version=${CARDSENSE_ENGINE_VERSION:cardsense-api-0.0.1-SNAPSHOT}
cardsense.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# --- Auth (Supabase — used in all profiles for client/API-key management) ---
cardsense.supabase.url=${CARDSENSE_SUPABASE_URL:jdbc:postgresql://db.bejboftorbxclrnltrcq.supabase.co:5432/postgres}
cardsense.supabase.username=${CARDSENSE_SUPABASE_USERNAME:postgres}
cardsense.supabase.password=${SUPABASE_PASSWORD:}
